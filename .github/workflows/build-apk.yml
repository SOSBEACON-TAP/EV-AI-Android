name: Build EV AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EV-AI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EV-AI-apk
          path: EV-AI.apk

      - name: Publish as a download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: EV AI for Android (latest build)
          body: Install EV-AI.apk on your phone. Built automatically from the android folder.
          files: EV-AI.apk
          prerelease: true
